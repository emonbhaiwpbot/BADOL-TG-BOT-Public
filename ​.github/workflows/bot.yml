name: Node.js CI

on:
  push:
    branches: [ "main" ] # অথবা আপনার ব্রাঞ্চের নাম (master হলে master দিন)
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x] # Node.js এর আধুনিক ভার্সন ব্যবহার করা হয়েছে

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        # এখানে cache অপশনটি রাখা হয়নি যাতে lock ফাইলের জন্য এরর না আসে

    - name: Install dependencies
      run: npm install

    - name: Start Bot
      run: node index.js
